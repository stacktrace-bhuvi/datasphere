# Small/Fast configuration for quick sanity checks
# Total SCMs: 5 families * 2 = 10 SCMs

dataset_name: "scm_benchmark_small"
n_scms_per_family: 2
d_range: [5, 7]
n_samples: 500
base_seed: 42

# Mechanism and noise configuration
nonlinearity_prob: 0.5
interaction_prob: 0.2
noise_type: "gaussian"
noise_scale: 1.0

# Stabilization and bounding
standardize: true
clip_bound: 10.0

# Supported graph families
families:
  - chain_mediation
  - confounded_fork
  - feature_collider
  - erdos_renyi_dag
  - layered

# Graph-family-level train / heldout partition
splits:
  train_families:
    - chain_mediation
    - confounded_fork
    - feature_collider
    - erdos_renyi_dag
  heldout_families:
    - layered
